name: CI

on:
  push:
    tags: ["*"]
    branches: ["main"]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-compose-action@v2
      - uses: jdx/mise-action@v4
        with:
          experimental: true
          cache_key_prefix: "mise-v1-ci"
      - run: mise run ci
