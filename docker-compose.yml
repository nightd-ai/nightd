services:
  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: nightd
      POSTGRES_PASSWORD: nightd
      POSTGRES_DB: nightd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightd -d nightd"]
      interval: 5s
      timeout: 5s
      retries: 5
