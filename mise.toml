[tasks."dev:nightd"]
run = "nightd"

[tasks."dev:web"]
run = "pn --filter web dev"

[tasks.fmt]
run = [
  "ruff format",
  "pn fmt",
]

[tasks."ci:python"]
run = [
  "ruff format --check",
  "ruff check",
  "ty check",
]

[tasks."ci:typescript"]
run = [
  "pn fmt:check",
  "pn lint",
  "pn -r typecheck",
]

[tasks.ci]
depends = [
  "ci:python",
  "ci:typescript",
]

[tasks.docs]
run = "zensical build --clean"

[env]
MISE_EXPERIMENTAL = 1

[tools]
node = "lts/krypton"
pnpm = "latest"
uv = "latest"

[deps.uv]
auto = true

[deps.pnpm]
auto = true

[settings]
python.uv_venv_auto = "source"
