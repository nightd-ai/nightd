[tasks."dev:desktop"]
run = "pn --filter desktop tauri dev"

[tasks."dev:daemon"]
run = "cargo run -p daemon -- start"

[tasks.fmt]
run = [
  "cargo fmt",
  "pn fmt",
]

[tasks."ci:rust"]
run = [
  "cargo fmt --check",
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[tasks."ci:typescript"]
run = [
  "pn fmt:check",
  "pn lint",
  "pn -r typecheck",
]

[tasks.ci]
depends = ["ci:rust", "ci:typescript"]

[tasks.docs]
run = "uvx zensical build --clean"

[env]
NIGHTD_SOCKET_PATH = "{{config_root}}/nightd.socket"
_.file = '.env'

[tools]
node = "lts"
pnpm = "latest"
uv = "latest"

[deps.pnpm]
auto = true

[settings]
idiomatic_version_file_enable_tools = ["rust"]
