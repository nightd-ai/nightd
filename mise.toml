[tasks."ci:rust"]
run = [
  "cargo fmt --check",
  "cargo check --workspace",
  "cargo clippy --workspace -- -D warnings",
  "cargo test --workspace",
]

[tasks."ci:typescript"]
run = [
  "pn fmt:check",
  "pn lint",
  "pn -r typecheck",
]

[tasks.ci]
depends = ["ci:rust", "ci:typescript"]

[tasks.docs]
run = "uvx zensical build --clean"

[tools]
node = "lts/krypton"
pnpm = "latest"
uv = "latest"

[deps.pnpm]
auto = true
