[tasks.fmt]
run = "gofmt -w ."

[tasks.ci]
run = [
  "test -z \"$(gofmt -l .)\"",
  "go build ./...",
  "golangci-lint run",
  "go test ./...",
]

[tasks."dev:nightd"]
run = "go run cmd/nightd/main.go start"

[tasks.docs]
run = "uvx zensical build --clean"

[env]
_.file = '.env'

[tools]
go = "latest"
golangci-lint = "latest"
uv = "latest"
