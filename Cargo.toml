[workspace]
resolver = "3"
members = ["apps/daemon", "apps/cli", "apps/desktop/src-tauri", "crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
nightd-client = { path = "crates/nightd-client" }
